<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenLayer AI Dispute Resolver</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-left: 5px solid #007bff; display: none; }
    </style>
</head>
<body>
    <h1>⚖️ AI Dispute Resolver</h1>
    <p>Powered by GenLayer Intelligent Contracts</p>

    <label>Party A Name:</label>
    <input type="text" id="partyA" placeholder="e.g. Alice"><br><br>
    
    <label>Party A's Claim:</label>
    <textarea id="claimA" placeholder="Describe the issue..."></textarea>

    <label>Party B Name:</label>
    <input type="text" id="partyB" placeholder="e.g. Bob"><br><br>

    <label>Party B's Claim:</label>
    <textarea id="claimB" placeholder="Describe the counter-claim..."></textarea>

    <button onclick="solveDispute()">Ask AI Judge</button>

    <div id="result">
        <strong>Verdict:</strong> <span id="verdict"></span><br>
        <strong>Reasoning:</strong> <span id="reasoning"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
